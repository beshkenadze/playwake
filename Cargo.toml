[package]
name = "playwake"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["core", "gamestream", "media-worker"]
default-members = ["."]

[dependencies]
gpui-kit = "=0.10.0"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tempfile = "3"
raw-window-handle = "0.6"
playwake-core = { version = "0.2.0", path = "core" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
gilrs = "0.11"
