[package]
name = "playwake-media"
version = "0.2.0"
edition = "2024"
description = "Native GStreamer media worker for Playwake (replaces the PyGObject worker)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.23", features = ["v1_20"] }
gstreamer-base = { version = "0.23", features = ["v1_20"] }
gstreamer-video = { version = "0.23", features = ["v1_20"] }
gstreamer-webrtc = { version = "0.23", features = ["v1_20"] }
gstreamer-sdp = { version = "0.23", features = ["v1_20"] }
x11rb = { version = "0.13", features = ["res", "shape", "xinput"] }
evdev = "0.13"
cairo-rs = { version = "0.20", features = ["xlib"] }
x11-dl = "2"
libc = "0.2"
gamestream = { version = "0.1.0", path = "../gamestream" }
gstreamer-app = { version = "0.23", features = ["v1_20"] }
ash = "0.38"
playwake-core = { version = "0.2.0", path = "../core" }
