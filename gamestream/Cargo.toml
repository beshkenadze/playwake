[package]
name = "gamestream"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
hex = "0.4.3"
rand = "0.10.4"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
x509-cert = { version = "0.3.1", features = ["builder", "pem"] }
