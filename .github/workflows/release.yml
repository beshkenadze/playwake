name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  tarball:
    uses: ./.github/workflows/ci.yml

  flatpak:
    uses: ./.github/workflows/linux.yml

  # Publish once with every artifact: immutable releases reject asset
  # uploads after publication, so two independent publishers race and lose.
  release:
    needs: [tarball, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwake-steamos-x86_64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: playwake-linux-x86_64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.flatpak
            dist/SHA256SUMS
          generate_release_notes: true