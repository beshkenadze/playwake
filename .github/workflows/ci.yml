name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat packaging/build-deps.txt)

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build, test and package
        run: packaging/build-bundle.sh --native

      - uses: actions/upload-artifact@v4
        with:
          name: playwake-steamos-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error