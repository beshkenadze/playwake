name: Linux Flatpak

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-flatpak-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test Playwake
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:aca68c361f2a89de8a64e8d91a47494f37fad05f88c2f503cdd8a284a74c70ac
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git
        run: dnf -y install git
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-rust
      - name: Run Rust tests
        run: cargo test --release --locked --workspace

  build:
    name: Build x86-64 Flatpak
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Flatpak runs bubblewrap during packaging and the smoke test.
      image: registry.fedoraproject.org/fedora:44@sha256:aca68c361f2a89de8a64e8d91a47494f37fad05f88c2f503cdd8a284a74c70ac
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git and Python
        run: dnf -y install git python3

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must be v$version to match Cargo.toml."
            exit 1
          fi
          # The container user differs from the owner of the runner workspace.
          if ! git -c safe.directory="$GITHUB_WORKSPACE" merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag a commit on main to publish a release."
            exit 1
          fi

      - uses: ./.github/actions/setup-linux-rust

      - name: Build Playwake
        run: cargo build --release --locked --workspace

      - name: Install Flatpak packaging dependencies
        run: |
          # Fedora stores libXres's COPYING file in the RPM documentation.
          dnf -y install --setopt=install_weak_deps=False --setopt=tsflags= \
            flatpak libXres xprop ffmpeg-free

      - name: Install Flatpak SDK and runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08

      - name: Package and smoke-test the Flatpak
        run: |
          mkdir -p dist
          bundle=dist/Playwake-steamos-x86_64.flatpak
          packaging/flatpak/build-bundle.sh target/release/playwake "$bundle"
          flatpak install --user --noninteractive "$bundle"
          flatpak run --command=sh io.github.beshkenadze.Playwake -ec '
            ldd /app/libexec/playwake/playwake > /tmp/playwake-ldd.txt
            cat /tmp/playwake-ldd.txt
            if grep -q "not found" /tmp/playwake-ldd.txt; then exit 1; fi
            python3 -c "import ctypes, evdev, gi; ctypes.CDLL(\"libXRes.so.1\")"
            ldd /app/libexec/playwake/playwake-media > /tmp/media-ldd.txt
            if grep -q "not found" /tmp/media-ldd.txt; then exit 1; fi
            /app/libexec/playwake/playwake-media --selftest
            for element in webrtcbin nicesrc vulkansink opusdec; do
              gst-inspect-1.0 "$element" >/dev/null
            done
          '
          cd dist
          sha256sum Playwake-steamos-x86_64.flatpak > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwake-linux-x86_64
          path: |
            dist/Playwake-steamos-x86_64.flatpak
            dist/SHA256SUMS
          if-no-files-found: error
