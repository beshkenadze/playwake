name: PlaywakeIOS
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 158.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  PlaywakeIOS:
    type: application
    platform: iOS
    sources:
      - path: PlaywakeIOS
        excludes:
          - "Media/README.md"
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-rust-core.sh"
    dependencies:
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.beshkenadze.playwake.ios
        PRODUCT_NAME: Playwake
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_OBJC_BRIDGING_HEADER: PlaywakeIOS/Core/playwake_core.h
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Rust"
        OTHER_LDFLAGS:
          - "-lplaywake_core"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
    info:
      path: PlaywakeIOS/Info.plist
      properties:
        CFBundleDisplayName: Playwake
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: Playwake streams Xbox video from consoles on your local network.
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  PlaywakeIOS:
    build:
      targets:
        PlaywakeIOS: all
    run:
      config: Debug
      commandLineArguments:
        "-autolab": true
    test:
      config: Debug
